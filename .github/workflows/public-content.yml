name: Public content check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tracked content
        run: python3 scripts/check_public_repo.py --tracked
